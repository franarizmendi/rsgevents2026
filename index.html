<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSG Events Plan</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  :root{
    --navy:#0B1F3A; --orange:#F25C1F; --orange-deep:#B5400D; --ink:#0B1F3A;
    --slate:#5A6470; --fog:#C9D4E3; --cream:#F5F2EC; --line:#E2DCCF; --card:#FFFFFF; --wash:#FAF8F3;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#0B0B0C;color:var(--ink);overflow:hidden;display:flex}

  #rail{width:184px;min-width:184px;height:100vh;overflow-y:auto;background:#0B0B0C;padding:12px 10px 24px 26px}
  .thumbwrap{position:relative;margin-bottom:14px;cursor:pointer}
  .thumbnum{position:absolute;left:-18px;top:2px;color:#9AA3A9;font-size:11px;font-weight:600}
  .thumb{width:148px;height:83px;border-radius:4px;overflow:hidden;position:relative;background:#fff;border:2px solid transparent}
  .thumbwrap.active .thumb{border-color:var(--orange)}
  .thumb .mini{width:1280px;height:720px;transform:scale(0.1125);transform-origin:top left;position:absolute;top:0;left:0;pointer-events:none}

  #stage{flex:1;height:100vh;display:flex;align-items:center;justify-content:center;position:relative}
  #frame{width:1280px;height:720px;transform-origin:center center;position:relative}

  .slide{width:1280px;height:720px;background:var(--cream);padding:64px 80px;position:absolute;inset:0;display:none;flex-direction:column}
  .slide.on{display:flex}
  .slide.dark{background:var(--navy);color:#fff}

  .kicker{color:var(--orange-deep);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
  .slide.dark .kicker{color:var(--orange)}
  h1.big{font-size:58px;font-weight:800;letter-spacing:-0.02em;line-height:1.05}
  h1.head{font-size:38px;font-weight:800;letter-spacing:-0.02em;color:var(--navy);line-height:1.1}
  .slide.dark h1.head{color:#fff}
  .dash{width:36px;height:5px;background:var(--orange);border-radius:2px;margin:26px 0}
  .dash.tight{margin:12px 0 22px}
  .sub{font-size:22px;color:var(--fog);font-weight:400;margin-top:16px}
  .footrow{margin-top:auto;display:flex;justify-content:space-between;color:#9DAEC6;font-size:14px}
  .brandrow{display:flex;align-items:center;gap:16px;margin-bottom:8px}
  .brandsep{width:1px;height:22px;background:rgba(255,255,255,.3)}
  .brandtag{color:var(--orange);font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}

  .goal{display:flex;gap:26px;border:1px solid var(--line);border-radius:10px;padding:22px 28px;margin-bottom:18px;background:var(--card)}
  .goalnum{font-size:34px;font-weight:800;color:var(--orange-deep);letter-spacing:-0.02em;min-width:58px}
  .goallabel{font-size:11px;font-weight:700;letter-spacing:.14em;color:#93A2AB;text-transform:uppercase;margin-bottom:4px}
  .goaltitle{font-size:20px;font-weight:750;color:var(--navy);margin-bottom:5px}
  .goalbody{font-size:14.5px;color:var(--slate);line-height:1.45}

  .filtergrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4px}
  .fcard{border:1px solid var(--line);border-radius:10px;padding:18px 22px;background:var(--card);display:flex;gap:16px}
  .fnum{font-size:22px;font-weight:800;color:var(--orange-deep);min-width:30px}
  .ftitle{font-size:15.5px;font-weight:750;color:var(--navy);margin-bottom:3px}
  .fbody{font-size:12.5px;color:var(--slate);line-height:1.45}
  .rulebar{margin-top:20px;border-radius:10px;background:var(--wash);border:1px solid var(--line);padding:14px 22px;font-size:13.5px;color:var(--slate)}
  .rulebar b{color:var(--navy)}

  .legend{display:flex;gap:20px;align-items:center;font-size:13px;color:var(--ink);font-weight:600}
  .swatch{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--orange);margin-right:6px}
  .swatch.open{background:#fff;border:2px solid var(--navy);width:7px;height:7px}
  .swatch.dec{background:transparent;border:2px dashed var(--orange-deep);width:7px;height:7px;border-radius:2px}
  .calhead{display:flex;justify-content:space-between;align-items:flex-end}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:2px solid var(--navy);margin-top:20px}
  .calcol{border-right:1px solid #EAE4D8;padding:14px 9px 0 11px;min-height:380px}
  .calcol:last-child{border-right:none}
  .calmon{font-size:18px;font-weight:800;color:var(--navy)}
  .calyr{font-size:12px;color:#93A2AB;margin-bottom:12px}
  .evc{border:1px solid var(--line);border-radius:7px;padding:9px 10px;margin-bottom:9px;background:#fff}
  .evc .n{font-size:13px;font-weight:700;color:var(--navy);line-height:1.25}
  .evc .d{font-size:11.5px;color:#7A8A93;margin-top:3px}
  .evc .tag{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px;color:var(--orange)}
  .evc.flag{background:var(--navy);border-color:var(--navy)}
  .evc.flag .n{color:#fff}
  .evc.flag .d{color:var(--fog)}
  .evc.opt{border:1.5px dashed var(--orange-deep);background:var(--wash)}
  .evc.opt .tag{color:var(--orange-deep)}
  .evc.ghost{border:1px dashed #D8D1C2;background:transparent}
  .evc.ghost .n{color:#A6A99E;font-weight:500}

  /* detail slides */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0 26px}
  .stat{border:1px solid var(--line);border-radius:9px;padding:14px 16px;background:var(--card)}
  .stat .l{font-size:11px;font-weight:700;letter-spacing:.13em;color:#93A2AB;text-transform:uppercase;margin-bottom:6px}
  .stat .v{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-0.01em;line-height:1.2}
  .stat .v.money{color:var(--orange-deep)}
  .stat .s{font-size:11px;color:#93A2AB;margin-top:4px}
  .detgrid{display:grid;grid-template-columns:1.45fr 1fr;gap:44px;flex:1;min-height:0}
  .h6{font-size:12.5px;font-weight:800;letter-spacing:.13em;color:var(--navy);text-transform:uppercase;margin-bottom:9px}
  .what{font-size:14px;color:var(--slate);line-height:1.55;margin-bottom:18px}
  ul.act{list-style:none}
  ul.act li{font-size:13.5px;color:var(--ink);line-height:1.45;margin-bottom:8px;padding-left:18px;position:relative}
  ul.act li::before{content:"";width:7px;height:7px;background:var(--orange);position:absolute;left:0;top:6px}
  .badgecard{border-radius:12px;background:linear-gradient(160deg,var(--navy) 0%,#17365F 100%);color:#fff;padding:28px 28px;display:flex;flex-direction:column;justify-content:space-between;min-height:260px}
  .badgecard .big-ab{font-size:40px;font-weight:800;letter-spacing:-0.02em;line-height:1.05}
  .badgecard .vert{font-size:12px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--orange);margin-bottom:12px}
  .badgecard .facts{font-size:13px;color:var(--fog);line-height:1.55;margin-top:16px}
  .badgecard .facts b{color:#fff}

  /* budget builder (compact) */
  table.bd{width:100%;border-collapse:collapse;margin-top:16px}
  table.bd th{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#93A2AB;text-align:left;padding:0 8px 8px 0;border-bottom:2px solid var(--navy)}
  table.bd th.r, table.bd td.r{text-align:right;padding-right:0}
  table.bd td{padding:6px 8px 6px 0;border-bottom:1px solid #EAE4D8;font-size:12.5px;color:var(--slate);vertical-align:middle;white-space:nowrap}
  table.bd td.n{font-weight:750;color:var(--navy);font-size:13px}
  table.bd td.c{font-weight:800;color:var(--navy);font-size:13px}
  table.bd td.lt{color:var(--orange-deep)}
  tr.brow.off td{opacity:.42}
  tr.brow.off td.c{text-decoration:line-through}
  tr.brow td.chk{opacity:1 !important}
  .chk input{accent-color:var(--orange);width:15px;height:15px;vertical-align:-2px;cursor:pointer}
  .chk .lbl{font-size:11px;font-weight:700;margin-left:6px;color:var(--navy);display:inline-block;width:42px}
  tr.brow.off .chk .lbl{color:#A6A99E}
  .pill{display:inline-block;font-size:8.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:2px 6px;border-radius:4px;margin-left:7px;vertical-align:1px}
  .pill.keep{background:var(--navy);color:#fff}
  .pill.dec{background:transparent;border:1px dashed var(--orange-deep);color:var(--orange-deep)}
  .pill.fy{background:#E4E0D6;color:#7A8A93}
  tr.prod td{background:var(--wash);font-weight:600}
  .totbar{margin-top:16px;display:flex;gap:16px;align-items:center}
  .totcard{border:1px solid var(--line);border-radius:9px;padding:10px 18px;background:var(--card)}
  .totcard .l{font-size:9.5px;font-weight:700;letter-spacing:.11em;color:#93A2AB;text-transform:uppercase}
  .totcard .v{font-size:20px;font-weight:800;color:var(--navy)}
  .totcard.grand{background:var(--navy);border-color:var(--navy);margin-left:auto}
  .totcard.grand .l{color:var(--fog)}
  .totcard.grand .v{color:#fff;font-size:24px}

  .actgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
  .actcard{border:1px solid var(--line);border-radius:10px;padding:20px 24px;display:flex;gap:18px;background:var(--card)}
  .actnum{font-size:24px;font-weight:800;color:var(--orange-deep);min-width:34px}
  .acttitle{font-size:16px;font-weight:750;color:var(--navy);margin-bottom:4px}
  .actbody{font-size:13.5px;color:var(--slate);line-height:1.45}
  .actbody b{color:var(--navy)}
</style>
</head>

<div id="stage"><div id="frame"></div></div>

<!-- 2 · THE BET -->
<section class="slide">
  <div class="kicker">The Bet</div>
  <h1 class="head">Events exist to break the growth bottleneck</h1>
  <div class="dash tight"></div>
  <div class="goal">
    <div class="goalnum">01</div>
    <div><div class="goallabel">Primary</div><div class="goaltitle">Non-linear growth for RSG</div>
    <div class="goalbody">$7.1M gross revenue run-rate, 422 facilities served in August, and 86%+ of facilities return after their second work order. Fulfillment is not the constraint; growth is. Every event is judged on facilities onboarded and multi-site accounts opened.</div></div>
  </div>
  <div class="goal">
    <div class="goalnum">02</div>
    <div><div class="goallabel">The Flip</div><div class="goaltitle">Show up as the service provider, not the software</div>
    <div class="goalbody">FM conferences exist so facility leaders can find service providers. We used to be the software vendor in the corner; as RSG we are exactly what the room came to shop for. Booths sell outcomes: fastest response, white-glove reports, guarantees.</div></div>
  </div>
  <div class="goal">
    <div class="goalnum">03</div>
    <div><div class="goallabel">Focus</div><div class="goaltitle">Core markets first, national where multi-site HQs gather</div>
    <div class="goalbody">NYC, Toronto, Miami, Texas, and the DMV are where we deliver today. Local events produce serviceable leads; national events count when the multi-site accounts in the room span our footprint.</div></div>
  </div>
</section>

<section class="slide">
  <div class="kicker">The Filter</div>
  <h1 class="head">Five checks every event must pass</h1>
  <div class="dash tight"></div>
  <div class="filtergrid">
    <div class="fcard"><div class="fnum">1</div><div><div class="ftitle">Service-buyer density</div><div class="fbody">The room buys commercial R&amp;M and PM services: FM leaders, ops, finance approvers. Software-evaluator rooms (CIO/CTO) no longer count.</div></div></div>
    <div class="fcard"><div class="fnum">2</div><div><div class="ftitle">Multi-site leverage</div><div class="fbody">One conversation opens many facilities. Logos with 50 to 500 rooftops, not single locations.</div></div></div>

<script>
(function(){
  const tpl=document.getElementById('slides');
  const frame=document.getElementById('frame');
  const rail=document.getElementById('rail');
  const slides=[...tpl.content.querySelectorAll('.slide')];
  slides.forEach((s,i)=>{
    const main=s.cloneNode(true); main.dataset.i=i; frame.appendChild(main);
    const w=document.createElement('div'); w.className='thumbwrap';
    w.innerHTML='<div class="thumbnum">'+(i+1)+'</div>';
    const t=document.createElement('div'); t.className='thumb';
    const mini=s.cloneNode(true); mini.classList.add('mini','on'); mini.style.display='flex';
    t.appendChild(mini); w.appendChild(t); rail.appendChild(w);
    w.addEventListener('click',()=>go(i));
  });
  const mains=[...frame.querySelectorAll(':scope > .slide')];
  const thumbs=[...rail.querySelectorAll('.thumbwrap')];
  let cur=-1;
  function go(i){
    i=Math.max(0,Math.min(slides.length-1,i));
    if(i===cur)return; cur=i;
    mains.forEach((m,j)=>m.classList.toggle('on',j===i));
    thumbs.forEach((t,j)=>t.classList.toggle('active',j===i));
    location.hash='#'+(i+1);
    thumbs[i].scrollIntoView({block:'nearest'});
  }
  function fit(){
    const st=document.getElementById('stage');
    const s=Math.min(st.clientWidth/1280,st.clientHeight/720);
    frame.style.transform='scale('+s+')';
  }
  window.addEventListener('resize',fit);
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT')return;
    if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ')go(cur+1);
    if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(cur-1);
  });

  const PRODUCTION=10000;
  function money(n){return '$'+n.toLocaleString('en-US')}
  function calc(){
    let sp=0,lg=0,n=0;
    frame.querySelectorAll('tr.brow').forEach(r=>{
      const on=r.querySelector('input').checked;
      r.classList.toggle('off',!on);
      r.querySelector('.lbl').textContent=on?'Attend':'Pass';
      if(on){sp+=+r.dataset.sponsor;lg+=+r.dataset.logi;n++}
    });
    frame.querySelector('#t-n').textContent=n;
    frame.querySelector('#t-sp').textContent=money(sp);
    frame.querySelector('#t-lg').textContent=money(lg);
    frame.querySelector('#t-gr').textContent=money(sp+lg+PRODUCTION);
  }
  frame.querySelectorAll('tr.brow input').forEach(cb=>cb.addEventListener('change',calc));
  calc();

  fit();
  go((parseInt(location.hash.slice(1))||1)-1);
})();
</script>
