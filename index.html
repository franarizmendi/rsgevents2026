<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResQ FM Events Calendar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  :root{
    --navy:#0B1F3A; --navy-deep:#0B1F3A; --orange:#F25C1F; --orange-deep:#B5400D; --ink:#0B1F3A;
    --slate:#5A6470; --fog:#C9D4E3; --cream:#F5F2EC; --line:#E2DCCF; --card:#FFFFFF; --wash:#FAF8F3;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#0B0B0C;color:var(--ink);overflow:hidden;display:flex}

  /* ---------- Sidebar ---------- */
  #rail{width:184px;min-width:184px;height:100vh;overflow-y:auto;background:#0B0B0C;padding:12px 10px 24px 26px}
  .thumbwrap{position:relative;margin-bottom:14px;cursor:pointer}
  .thumbnum{position:absolute;left:-18px;top:2px;color:#9AA3A9;font-size:11px;font-weight:600}
  .thumb{width:148px;height:83px;border-radius:4px;overflow:hidden;position:relative;background:#fff;border:2px solid transparent}
  .thumbwrap.active .thumb{border-color:var(--orange)}
  .thumb .mini{width:1280px;height:720px;transform:scale(0.1125);transform-origin:top left;position:absolute;top:0;left:0;pointer-events:none}

  /* ---------- Stage ---------- */
  #stage{flex:1;height:100vh;display:flex;align-items:center;justify-content:center;position:relative}
  #frame{width:1280px;height:720px;transform-origin:center center;position:relative}

  /* ---------- Slides ---------- */
  .slide{width:1280px;height:720px;background:var(--cream);padding:72px 84px;position:absolute;inset:0;display:none;flex-direction:column}
  .slide.on{display:flex}
  .slide.dark{background:var(--navy);color:#fff}

  .kicker{color:var(--orange-deep);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
  .slide.dark .kicker{color:var(--orange)}
  h1.big{font-size:58px;font-weight:800;letter-spacing:-0.02em;line-height:1.05}
  h1.head{font-size:40px;font-weight:800;letter-spacing:-0.02em;color:var(--navy);line-height:1.1}
  .slide.dark h1.head{color:#fff}
  .dash{width:36px;height:5px;background:var(--orange);border-radius:2px;margin:26px 0}
  .dash.tight{margin:14px 0 26px}
  .sub{font-size:22px;color:var(--fog);font-weight:400;margin-top:16px}
  .footrow{margin-top:auto;display:flex;justify-content:space-between;color:#9DAEC6;font-size:14px}
  .brandrow{display:flex;align-items:center;gap:16px;margin-bottom:8px}
  .brandsep{width:1px;height:22px;background:rgba(255,255,255,.3)}
  .brandtag{color:var(--orange);font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}

  /* goal cards */
  .goal{display:flex;gap:26px;border:1px solid var(--line);border-radius:10px;padding:22px 28px;margin-bottom:18px;background:var(--card)}
  .goalnum{font-size:34px;font-weight:800;color:var(--orange-deep);letter-spacing:-0.02em;min-width:58px}
  .goallabel{font-size:11px;font-weight:700;letter-spacing:.14em;color:#93A2AB;text-transform:uppercase;margin-bottom:4px}
  .goaltitle{font-size:20px;font-weight:750;color:var(--navy);margin-bottom:5px}
  .goalbody{font-size:14.5px;color:var(--slate);line-height:1.45}

  /* two-col how */
  .howgrid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:8px}
  .howcol{border:1px solid var(--line);border-radius:10px;padding:28px 30px;background:var(--card)}
  .howicon{font-size:22px;color:var(--orange-deep);font-weight:800;margin-bottom:10px}
  .howtitle{font-size:21px;font-weight:750;color:var(--navy);margin-bottom:10px}
  .howbody{font-size:14.5px;color:var(--slate);line-height:1.55}
  .howbody li{margin:0 0 8px 16px}
  .rulebar{margin-top:26px;border-radius:10px;background:var(--wash);border:1px solid var(--line);padding:16px 24px;font-size:14px;color:var(--slate)}
  .rulebar b{color:var(--navy)}

  /* calendar */
  .legend{display:flex;gap:22px;align-items:center;font-size:14px;color:var(--ink);font-weight:600}
  .swatch{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--orange);margin-right:7px}
  .swatch.open{background:#fff;border:2px solid var(--navy);width:7px;height:7px}
  .calhead{display:flex;justify-content:space-between;align-items:flex-end}
  .cal{display:grid;grid-template-columns:repeat(8,1fr);border-top:2px solid var(--navy);margin-top:22px}
  .calcol{border-right:1px solid #EAE4D8;padding:16px 10px 0 12px;min-height:360px}
  .calcol:last-child{border-right:none}
  .calmon{font-size:19px;font-weight:800;color:var(--navy)}
  .calyr{font-size:12px;color:#93A2AB;margin-bottom:14px}
  .evc{border:1px solid var(--line);border-radius:7px;padding:10px 11px;margin-bottom:10px;background:#fff}
  .evc .n{font-size:13.5px;font-weight:700;color:var(--navy);line-height:1.25}
  .evc .d{font-size:12px;color:#7A8A93;margin-top:3px}
  .evc.flag{background:var(--navy);border-color:var(--navy)}
  .evc.flag .n{color:#fff}
  .evc.flag .d{color:var(--fog)}
  .evc.flag .tag{font-size:9.5px;font-weight:800;letter-spacing:.12em;color:var(--orange);text-transform:uppercase;margin-bottom:3px}
  .evc.ghost{border:1px dashed #D8D1C2;background:transparent}
  .evc.ghost .n{color:#A6A99E;font-weight:500}

  /* tables */
  table.ev{width:100%;border-collapse:collapse;margin-top:26px}
  table.ev th{font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#93A2AB;text-align:left;padding:0 10px 12px 0;border-bottom:2px solid var(--navy)}
  table.ev th.r, table.ev td.r{text-align:right;padding-right:0}
  table.ev td{padding:16px 10px 16px 0;border-bottom:1px solid #EAE4D8;vertical-align:top;font-size:14px;color:var(--slate);line-height:1.4}
  table.ev td.n{font-size:15.5px;font-weight:750;color:var(--navy);white-space:nowrap}
  table.ev td.c{font-size:17px;font-weight:800;color:var(--navy);white-space:nowrap}
  table.ev tr.sum td{border-bottom:none;padding-top:22px}
  table.ev tr.sum .lbl{font-size:12px;font-weight:700;letter-spacing:.13em;color:#93A2AB;text-transform:uppercase}
  table.ev tr.sum .tot{font-size:22px;font-weight:800;color:var(--orange-deep)}
  .tablenote{font-size:12.5px;color:#93A2AB;margin-top:18px;line-height:1.5}

  /* detail slides */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:26px 0 30px}
  .stat{border:1px solid var(--line);border-radius:9px;padding:16px 18px;background:var(--card)}
  .stat .l{font-size:11px;font-weight:700;letter-spacing:.13em;color:#93A2AB;text-transform:uppercase;margin-bottom:7px}
  .stat .v{font-size:19px;font-weight:800;color:var(--navy);letter-spacing:-0.01em;line-height:1.2}
  .stat .v.money{color:var(--orange-deep)}
  .stat .s{font-size:11.5px;color:#93A2AB;margin-top:4px}
  .detgrid{display:grid;grid-template-columns:1.45fr 1fr;gap:44px;flex:1;min-height:0}
  .h6{font-size:12.5px;font-weight:800;letter-spacing:.13em;color:var(--navy);text-transform:uppercase;margin-bottom:10px}
  .what{font-size:14.5px;color:var(--slate);line-height:1.6;margin-bottom:22px}
  ul.act{list-style:none}
  ul.act li{font-size:14px;color:var(--ink);line-height:1.5;margin-bottom:9px;padding-left:18px;position:relative}
  ul.act li::before{content:"";width:7px;height:7px;background:var(--orange);position:absolute;left:0;top:7px}
  .badgecard{border-radius:12px;background:linear-gradient(160deg,var(--navy) 0%,#17365F 100%);color:#fff;padding:30px 30px;display:flex;flex-direction:column;justify-content:space-between;min-height:280px}
  .badgecard .big-ab{font-size:44px;font-weight:800;letter-spacing:-0.02em;line-height:1.05}
  .badgecard .vert{font-size:12px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--orange);margin-bottom:12px}
  .badgecard .facts{font-size:13.5px;color:var(--fog);line-height:1.6;margin-top:18px}
  .badgecard .facts b{color:#fff}

  /* budget */
  .bignum{font-size:64px;font-weight:800;letter-spacing:-0.02em;color:var(--navy)}
  .bignum-note{font-size:15px;color:var(--slate);margin-left:14px}
  .bar{display:flex;height:44px;border-radius:7px;overflow:hidden;margin:30px 0 34px}
  .bar .seg{display:flex;align-items:center;padding-left:16px;font-size:14px;font-weight:700;color:#fff}
  .budgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .budcard{border:1px solid var(--line);border-radius:10px;padding:22px 26px;background:var(--wash)}
  .budcard .l{font-size:11.5px;font-weight:700;letter-spacing:.13em;color:#7A8A93;text-transform:uppercase;margin-bottom:8px}
  .budcard .l .sq{display:inline-block;width:9px;height:9px;margin-right:8px}
  .budcard .v{font-size:30px;font-weight:800;color:var(--navy)}
  .budcard .s{font-size:13px;color:var(--slate);margin-top:5px}
  .foot-note{font-size:13px;color:#93A2AB;margin-top:26px;line-height:1.5}

  /* next steps slide */
  .actgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
  .actcard{border:1px solid var(--line);border-radius:10px;padding:20px 24px;display:flex;gap:18px;background:var(--card)}
  .actnum{font-size:24px;font-weight:800;color:var(--orange-deep);min-width:34px}
  .acttitle{font-size:16px;font-weight:750;color:var(--navy);margin-bottom:4px}
  .actbody{font-size:13.5px;color:var(--slate);line-height:1.45}
  .actbody b{color:var(--navy)}
</style>
</head>

<!-- 2 · WHY -->
<section class="slide">
  <div class="kicker">The Goal</div>
  <h1 class="head">Why we invest in FM events</h1>
  <div class="dash tight"></div>
  <div class="goal">
    <div class="goalnum">01</div>
    <div><div class="goallabel">Primary</div><div class="goaltitle">Strengthen relationships and open new opportunities</div>
    <div class="goalbody">Every event is judged first on the relationships it builds and the pipeline it opens for RSG: new opportunities, warmer renewals, and stronger partnerships with the operators we serve.</div></div>
  </div>
  <div class="goal">
    <div class="goalnum">02</div>
    <div><div class="goallabel">Secondary</div><div class="goaltitle">Open the new verticals</div>
    <div class="goalbody">Healthcare (ASHE), property and buildings (PM Expo, IFMA), and multi-site FM networks (Connex) are our expansion bets. The goal is first logos plus a real read on buyer fit.</div></div>
  </div>
  <div class="goal">
    <div class="goalnum">03</div>
    <div><div class="goallabel">Third</div><div class="goaltitle">Broaden our understanding of the industry</div>
    <div class="goalbody">Entering new vertical events and forming relationships across them deepens our map of the FM landscape and tells us where next season's dollars should go.</div></div>
  </div>
</section>

<!-- 3 · HOW -->
<section class="slide">
  <div class="kicker">The Playbook</div>
  <h1 class="head">How we'll run FM events</h1>
  <div class="dash tight"></div>
  <div class="howgrid">
    <div class="howcol">
      <div class="howicon">●</div>
      <div class="howtitle">Exhibit &amp; sponsor: 4 events, $35,000</div>
      <div class="howbody">Full presence where the room is densest with our buyer, the cost is structurally low, or a relationship gives us leverage:
        <ul style="margin-top:10px"><li><b>RFMA</b>, the anchor: full booth, 3 people on site (~$15K all-in)</li><li><b>R365 Transform</b>: expanded sponsorship off the existing partnership</li><li><b>IFMA World Workplace</b>: booth in front of the broadest FM audience</li><li><b>PM Expo (Buildings Show)</b>: Toronto home turf, no travel cost</li></ul>
      </div>
    </div>
    <div class="howcol">
      <div class="howicon">○</div>
      <div class="howtitle">Attend &amp; scout: 3 events, $15,000</div>
      <div class="howbody">One to two people, meetings booked two weeks ahead, exec dinners over booth spend. Each scout show ends with a one-page verdict: exhibit next year, keep scouting, or drop.
        <ul style="margin-top:10px"><li>ASHE Innovation Conference (healthcare)</li><li>ConnexFM Mid-Year (multi-site FM network)</li><li>NFMT East (general FM, free registration)</li></ul>
      </div>

(function(){

  const mains=[...frame.querySelectorAll(':scope > .slide')];
  const thumbs=[...rail.querySelectorAll('.thumbwrap')];
  let cur=-1;
  function go(i){
    i=Math.max(0,Math.min(slides.length-1,i));
    if(i===cur)return; cur=i;
    mains.forEach((m,j)=>m.classList.toggle('on',j===i));
    thumbs.forEach((t,j)=>t.classList.toggle('active',j===i));

    const st=document.getElementById('stage');
    const s=Math.min(st.clientWidth/1280,st.clientHeight/720);
    frame.style.transform='scale('+s+')';
  }
  window.addEventListener('resize',fit);
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ')go(cur+1);
    if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(cur-1);
  });
  fit();
  go((parseInt(location.hash.slice(1))||1)-1);
})();
</script>
</body>
</html>
